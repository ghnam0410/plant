<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물과 에너지 행맨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'jua': ['Jua', 'sans-serif'],
                        'gowun': ['Gowun Dodum', 'sans-serif'],
                    },
                    colors: {
                        'nature-green': '#4ade80',
                        'nature-dark-green': '#15803d',
                        'nature-brown': '#78350f',
                        'nature-light-brown': '#d97706',
                        'nature-bg': '#f0fdf4',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0fdf4; /* nature-bg */
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, .title-font {
            font-family: 'Jua', sans-serif;
        }

        #plant-container {
            position: relative;
            width: 200px;
            height: 250px;
            margin: 0 auto;
            border-bottom: 4px solid #78350f; /* Ground */
            overflow: hidden;
        }

        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 180px;
            background-color: #15803d;
            border-radius: 6px;
            transition: all 0.5s ease;
        }

        .leaf-element {
            position: absolute;
            background-color: #4ade80;
            border-radius: 50% 0 50% 0;
            transition: all 0.5s ease;
        }

        /* Default Healthy Leaves */
        .leaf-1 { width: 40px; height: 40px; bottom: 120px; left: 40px; transform: rotate(-30deg); }
        .leaf-2 { width: 50px; height: 50px; bottom: 80px; left: 110px; transform: rotate(45deg); border-radius: 0 50% 0 50%; }
        .leaf-3 { width: 30px; height: 30px; bottom: 150px; left: 120px; transform: rotate(60deg); border-radius: 0 50% 0 50%; }
        .leaf-4 { width: 45px; height: 45px; bottom: 60px; left: 30px; transform: rotate(-45deg); }
        
        .flower-core {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #fbbf24;
            border-radius: 50%;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.5s ease;
        }

        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #f472b6;
            border-radius: 50%;
            transition: all 0.5s ease;
        }
        
        /* Petal positions relative to flower core */
        .petal-1 { top: -15px; left: 5px; }
        .petal-2 { top: 5px; left: 20px; }
        .petal-3 { top: 20px; left: 5px; }
        .petal-4 { top: 5px; left: -10px; }

        /* Withered States based on wrong guesses (0 to 8) */
        .state-1 .stem { background-color: #22c55e; }
        .state-1 .leaf-1 { transform: rotate(-40deg) translateY(5px); background-color: #86efac; }
        
        .state-2 .stem { background-color: #4ade80; }
        .state-2 .leaf-1 { opacity: 0; }
        .state-2 .leaf-2 { transform: rotate(55deg) translateY(5px); background-color: #86efac; }

        .state-3 .stem { background-color: #84cc16; }
        .state-3 .leaf-2 { opacity: 0; }
        .state-3 .leaf-3 { transform: rotate(70deg) translateY(5px); background-color: #bef264; }

        .state-4 .stem { background-color: #a3e635; }
        .state-4 .leaf-3 { opacity: 0; }
        .state-4 .leaf-4 { transform: rotate(-55deg) translateY(5px); background-color: #bef264; }

        .state-5 .stem { background-color: #ca8a04; }
        .state-5 .leaf-4 { opacity: 0; }
        .state-5 .petal-1 { opacity: 0; transform: translateY(20px); }

        .state-6 .stem { background-color: #a16207; height: 160px; }
        .state-6 .petal-2 { opacity: 0; transform: translateY(20px); }
        .state-6 .flower-core { bottom: 150px; background-color: #d97706; }

        .state-7 .stem { background-color: #713f12; height: 140px; transform: translateX(-50%) rotate(10deg); }
        .state-7 .petal-3 { opacity: 0; transform: translateY(20px); }
        .state-7 .flower-core { bottom: 130px; left: 55%; background-color: #92400e; }

        .state-8 .stem { background-color: #451a03; height: 100px; transform: translateX(-50%) rotate(30deg); }
        .state-8 .petal-4 { opacity: 0; transform: translateY(20px); }
        .state-8 .flower-core { bottom: 85px; left: 65%; background-color: #451a03; opacity: 0.5; }


        .letter-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 50px;
            margin: 0 4px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #15803d;
            border-bottom: 3px solid #15803d;
            text-transform: uppercase;
        }

        .keyboard-btn {
            width: 40px;
            height: 40px;
            margin: 4px;
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            background-color: #4ade80;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            font-family: 'Jua', sans-serif;
        }

        .keyboard-btn:hover:not(:disabled) {
            background-color: #15803d;
            transform: translateY(-2px);
        }

        .keyboard-btn:disabled {
            background-color: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            transform: translateY(0);
        }

        .keyboard-btn.correct {
            background-color: #3b82f6; /* Blue for correct guess */
        }

        .keyboard-btn.wrong {
            background-color: #ef4444; /* Red for wrong guess */
        }

        /* Life indicator */
        .life-leaf {
            display: inline-block;
            width: 24px;
            height: 24px;
            margin: 0 4px;
            background-color: #4ade80;
            border-radius: 50% 0 50% 0;
            transform: rotate(-45deg);
            transition: opacity 0.3s;
        }
        
        .life-leaf.lost {
            opacity: 0.2;
            background-color: #9ca3af;
        }

        #message-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #message-content {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 4px solid #4ade80;
            max-width: 90%;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="flex-grow flex flex-col items-center py-6 px-4 max-w-4xl mx-auto w-full">
        
        <!-- Header Section -->
        <header class="text-center mb-6 w-full">
            <h1 class="text-4xl text-nature-dark-green mb-2">식물과 에너지 행맨</h1>
            <h2 class="text-xl text-nature-brown mb-4">단어를 맞추고 나무를 살려주세요!</h2>
            
            <!-- Stage and Lives -->
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-green-200">
                <div class="title-font text-2xl text-nature-dark-green">
                    단계: <span id="stage-display">1</span> / 10
                </div>
                <div id="lives-container" class="flex items-center">
                    <!-- Leaves injected by JS -->
                </div>
            </div>
        </header>

        <!-- Game Area -->
        <main class="w-full flex flex-col items-center flex-grow">
            
            <!-- Plant Animation Area -->
            <div class="bg-white p-6 rounded-2xl shadow-md border-2 border-green-100 mb-8 w-full max-w-md flex justify-center">
                <div id="plant-container" class="state-0">
                    <div class="stem"></div>
                    <div class="leaf-element leaf-1"></div>
                    <div class="leaf-element leaf-2"></div>
                    <div class="leaf-element leaf-3"></div>
                    <div class="leaf-element leaf-4"></div>
                    <div class="flower-core">
                        <div class="petal petal-1"></div>
                        <div class="petal petal-2"></div>
                        <div class="petal petal-3"></div>
                        <div class="petal petal-4"></div>
                    </div>
                </div>
            </div>

            <!-- Word Display -->
            <div id="word-container" class="mb-10 min-h-[60px] flex flex-wrap justify-center gap-2">
                <!-- Letters injected by JS -->
            </div>

            <!-- Keyboard -->
            <div id="keyboard" class="flex flex-wrap justify-center max-w-3xl mb-8">
                <!-- Buttons injected by JS -->
            </div>
            
            <!-- Next Button (Hidden initially) -->
            <button id="next-btn" class="hidden bg-nature-dark-green text-white title-font text-2xl py-3 px-8 rounded-full shadow-lg hover:bg-green-800 transition transform hover:scale-105 mb-4">
                다음 단계로!
            </button>
            <button id="restart-btn" class="hidden bg-nature-brown text-white title-font text-2xl py-3 px-8 rounded-full shadow-lg hover:bg-yellow-900 transition transform hover:scale-105 mb-4">
                다시 시작하기
            </button>

        </main>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-4 bg-nature-dark-green text-white mt-auto">
        <p class="font-bold">제작자: 해누리중학교 과학교사 남국현</p>
    </footer>

    <!-- Modals -->
    <div id="message-modal" class="flex">
        <div id="message-content">
            <h2 id="modal-title" class="text-3xl mb-4 title-font"></h2>
            <p id="modal-desc" class="text-lg mb-6"></p>
            <p id="modal-answer" class="text-xl font-bold text-nature-dark-green mb-6 hidden"></p>
            <button id="modal-btn" class="bg-nature-light-brown text-white title-font py-2 px-6 rounded-lg text-xl hover:bg-yellow-700 transition">확인</button>
        </div>
    </div>

    <script>
        // Game Constants & State
        const MAX_MISTAKES = 8;
        
        // 새로 지정해주신 10개의 키워드 목록
        const WORDS = [
            { word: "WATER", hint: "뿌리에서 흡수되어 광합성에 사용되는 액체" },
            { word: "ENERGY", hint: "식물이 광합성을 통해 저장하고 생명활동에 사용하는 것" },
            { word: "OXYGEN", hint: "광합성 결과 발생하며, 호흡에 필요한 기체" },
            { word: "STARCH", hint: "광합성으로 만들어진 양분이 잎에 임시로 저장되는 형태" },
            { word: "GLUCOSE", hint: "광합성으로 최초로 만들어지는 양분" },
            { word: "SUGARCANE", hint: "광합성 양분을 설탕 형태로 저장하는 대표적인 식물" },
            { word: "RESPIRATION", hint: "포도당을 분해하여 생명 활동에 필요한 에너지를 얻는 과정" },
            { word: "CHLOROPLAST", hint: "식물 세포에서 광합성이 일어나는 장소" },
            { word: "CARBONDIOXIDE", hint: "광합성에 필요하며, 호흡 결과 방출되는 기체" },
            { word: "PHOTOSYNTHESIS", hint: "식물이 빛에너지를 이용하여 양분을 만드는 과정" }
        ];

        let currentStage = 0;
        let currentWord = "";
        let guessedLetters = new Set();
        let mistakes = 0;
        let isGameOver = false;

        // Sound Synthesis (Tone.js)
        let synth;
        
        function initAudio() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                Tone.start();
            }
        }

        function playSound(type) {
            initAudio();
            if (type === 'correct') {
                synth.triggerAttackRelease("C5", "8n");
            } else if (type === 'wrong') {
                synth.triggerAttackRelease("E2", "8n");
            } else if (type === 'win') {
                const now = Tone.now();
                synth.triggerAttackRelease("C4", "8n", now);
                synth.triggerAttackRelease("E4", "8n", now + 0.25);
                synth.triggerAttackRelease("G4", "8n", now + 0.5);
                synth.triggerAttackRelease("C5", "4n", now + 0.75);
            } else if (type === 'lose') {
                const now = Tone.now();
                synth.triggerAttackRelease("C3", "4n", now);
                synth.triggerAttackRelease("G2", "4n", now + 0.5);
                synth.triggerAttackRelease("C2", "2n", now + 1.0);
            }
        }

        // UI Elements
        const stageDisplay = document.getElementById('stage-display');
        const livesContainer = document.getElementById('lives-container');
        const plantContainer = document.getElementById('plant-container');
        const wordContainer = document.getElementById('word-container');
        const keyboardContainer = document.getElementById('keyboard');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const modal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalAnswer = document.getElementById('modal-answer');
        const modalBtn = document.getElementById('modal-btn');

        function initializeGame() {
            currentStage = 0;
            loadStage();
        }

        function loadStage() {
            isGameOver = false;
            mistakes = 0;
            guessedLetters.clear();
            currentWord = WORDS[currentStage].word;
            
            // Update UI
            stageDisplay.textContent = currentStage + 1;
            nextBtn.classList.add('hidden');
            restartBtn.classList.add('hidden');
            
            updateLivesDisplay();
            updatePlantVisuals();
            renderWord();
            renderKeyboard();
            
            // Show hint briefly
            showModal(`단어 힌트`, WORDS[currentStage].hint);
            modalAnswer.classList.add('hidden');
        }

        function updateLivesDisplay() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < MAX_MISTAKES; i++) {
                const leaf = document.createElement('div');
                leaf.className = `life-leaf ${i < MAX_MISTAKES - mistakes ? '' : 'lost'}`;
                livesContainer.appendChild(leaf);
            }
        }

        function updatePlantVisuals() {
            // Remove all state classes
            for (let i = 0; i <= MAX_MISTAKES; i++) {
                plantContainer.classList.remove(`state-${i}`);
            }
            // Add current state class
            plantContainer.classList.add(`state-${mistakes}`);
        }

        function renderWord() {
            wordContainer.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const letter = currentWord[i];
                const box = document.createElement('div');
                box.className = 'letter-box';
                
                if (guessedLetters.has(letter)) {
                    box.textContent = letter;
                } else {
                    box.textContent = ''; // Empty space
                }
                wordContainer.appendChild(box);
            }
        }

        function renderKeyboard() {
            keyboardContainer.innerHTML = '';
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                ['Z', 'X', 'C', 'V', 'B', 'N', 'M']
            ];

            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex justify-center w-full mb-2';
                
                row.forEach(letter => {
                    const btn = document.createElement('button');
                    btn.className = 'keyboard-btn';
                    btn.textContent = letter;
                    btn.id = `btn-${letter}`;
                    
                    if (guessedLetters.has(letter)) {
                        btn.disabled = true;
                        if (currentWord.includes(letter)) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                        }
                    }

                    btn.addEventListener('click', () => handleGuess(letter));
                    rowDiv.appendChild(btn);
                });
                keyboardContainer.appendChild(rowDiv);
            });
        }

        function handleGuess(letter) {
            if (isGameOver || guessedLetters.has(letter)) return;

            initAudio(); // Ensure audio context is started
            guessedLetters.add(letter);

            const btn = document.getElementById(`btn-${letter}`);
            btn.disabled = true;

            if (currentWord.includes(letter)) {
                // Correct guess
                btn.classList.add('correct');
                renderWord();
                
                // 단어를 모두 맞췄는지 확인 후, 승리 시에는 기본 정답음을 내지 않음
                const hasWon = currentWord.split('').every(l => guessedLetters.has(l));
                if (!hasWon) playSound('correct');
                
                checkWinCondition();
            } else {
                // Wrong guess
                btn.classList.add('wrong');
                mistakes++;
                updateLivesDisplay();
                updatePlantVisuals();
                
                // 목숨을 모두 잃었는지 확인 후, 패배 시에는 기본 오답음을 내지 않음
                if (mistakes < MAX_MISTAKES) playSound('wrong');
                
                checkLoseCondition();
            }
        }

        function checkWinCondition() {
            const hasWon = currentWord.split('').every(letter => guessedLetters.has(letter));
            if (hasWon) {
                isGameOver = true;
                playSound('win');
                disableAllButtons();
                
                if (currentStage < WORDS.length - 1) {
                    showModal("정답입니다!", "나무가 다시 생기를 되찾았어요! 다음 단계로 넘어가볼까요?");
                    nextBtn.classList.remove('hidden');
                } else {
                    showModal("축하합니다!", "모든 단계를 클리어했습니다! 식물 마스터가 되셨네요!");
                    restartBtn.classList.remove('hidden');
                }
            }
        }

        function checkLoseCondition() {
            if (mistakes >= MAX_MISTAKES) {
                isGameOver = true;
                playSound('lose');
                disableAllButtons();
                
                modalAnswer.textContent = `정답: ${currentWord}`;
                modalAnswer.classList.remove('hidden');
                showModal("게임 오버", "아쉽게도 나무가 시들어버렸어요...");
                restartBtn.classList.remove('hidden');
            }
        }

        function disableAllButtons() {
            const buttons = document.querySelectorAll('.keyboard-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        function showModal(title, desc) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            modal.style.display = 'flex';
        }

        modalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        nextBtn.addEventListener('click', () => {
            currentStage++;
            loadStage();
        });

        restartBtn.addEventListener('click', () => {
            initializeGame();
        });

        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (modal.style.display === 'flex') {
                    modalBtn.click();
                    return;
                }
                if (!nextBtn.classList.contains('hidden')) {
                    nextBtn.click();
                    return;
                }
                if (!restartBtn.classList.contains('hidden')) {
                    restartBtn.click();
                    return;
                }
            }

            if (isGameOver || modal.style.display === 'flex') return;
            
            const key = e.key.toUpperCase();
            if (/^[A-Z]$/.test(key)) {
                handleGuess(key);
            }
        });

        // Hide modal on initial load to prevent blocking
        modal.style.display = 'none';

        // Start game
        window.onload = initializeGame;

    </script>
</body>
</html>
