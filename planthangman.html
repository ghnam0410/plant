<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물과 에너지 행맨 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Gowun Dodum -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #f0fdf4;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        .key-btn {
            transition: all 0.15s ease-in-out;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn:active:not(:disabled) {
            transform: scale(0.92);
        }
        .leaf-icon {
            transition: all 0.3s ease;
        }
        .leaf-lost {
            filter: grayscale(100%);
            opacity: 0.25;
            transform: scale(0.85);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center text-slate-800 p-4 select-none bg-gradient-to-b from-emerald-100 via-green-50 to-emerald-100">

    <div class="w-full max-w-xl mx-auto flex flex-col items-center flex-grow">
        
        <!-- Header -->
        <header class="w-full text-center my-3">
            <h1 class="font-jua text-3xl sm:text-4xl text-emerald-800 tracking-wide drop-shadow-sm">
                🌿 식물과 에너지 행맨
            </h1>
            <p class="text-xs sm:text-sm text-emerald-600 mt-1">
                알맞은 알파벳을 맞춰 식물을 파릇파릇하게 가꿔보세요!
            </p>
        </header>

        <!-- Status Bar: Stage & Leaves (Lives) -->
        <div class="w-full bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm border border-emerald-200 mb-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="font-jua text-lg text-emerald-700">STAGE</span>
                <span id="stage-display" class="font-jua text-xl bg-emerald-100 text-emerald-800 px-3 py-0.5 rounded-full border border-emerald-300">
                    1 / 10
                </span>
            </div>
            
            <div class="flex flex-col items-end">
                <div class="text-xs text-emerald-600 mb-1 font-bold">남은 기회 (나뭇잎)</div>
                <div id="leaves-container" class="flex items-center gap-1">
                    <!-- Leaves dynamically inserted here -->
                </div>
            </div>
        </div>

        <!-- Plant Display Canvas/SVG Container -->
        <div class="w-full bg-white rounded-2xl p-4 shadow-md border border-emerald-200 mb-4 flex flex-col items-center justify-center relative min-h-[200px]">
            <div id="plant-illustration" class="w-48 h-48 flex items-center justify-center">
                <!-- SVG Plant rendered by JS -->
            </div>
        </div>

        <!-- Hint Box -->
        <div class="w-full bg-emerald-50 rounded-xl p-3 border border-emerald-200 mb-4 text-center">
            <span class="font-jua text-emerald-800 text-sm bg-emerald-200/80 px-2.5 py-0.5 rounded-md mr-1">힌트</span>
            <span id="hint-text" class="text-sm sm:text-base text-slate-700 font-medium">
                뿌리에서 흡수되어 광합성에 사용되는 액체
            </span>
        </div>

        <!-- Word Display Area -->
        <div id="word-display" class="w-full flex flex-wrap justify-center items-center gap-2 my-4 min-h-[50px]">
            <!-- Letters / Underscores dynamically inserted -->
        </div>

        <!-- Virtual Keyboard -->
        <div id="keyboard" class="w-full bg-white/60 p-3 rounded-2xl shadow-sm border border-emerald-200 my-auto">
            <!-- Row 1 -->
            <div class="flex justify-center gap-1 sm:gap-1.5 mb-1.5">
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="Q">Q</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="W">W</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="E">E</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="R">R</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="T">T</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="Y">Y</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="U">U</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="I">I</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="O">O</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="P">P</button>
            </div>
            <!-- Row 2 -->
            <div class="flex justify-center gap-1 sm:gap-1.5 mb-1.5">
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="A">A</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="S">S</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="D">D</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="F">F</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="G">G</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="H">H</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="J">J</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="K">K</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="L">L</button>
            </div>
            <!-- Row 3 -->
            <div class="flex justify-center gap-1 sm:gap-1.5">
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="Z">Z</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="X">X</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="C">C</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="V">V</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="B">B</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="N">N</button>
                <button class="key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2.5 sm:px-3.5 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base" data-key="M">M</button>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="mt-4 text-center text-xs text-emerald-700 py-2">
        제작자: 해누리중학교 과학교사 남국현
    </footer>

    <!-- Result / Transition Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-xl border border-emerald-100 transform transition-all">
            <div id="modal-icon" class="text-5xl mb-3">🎉</div>
            <h2 id="modal-title" class="font-jua text-2xl text-emerald-800 mb-2">정답입니다!</h2>
            <p id="modal-message" class="text-sm text-slate-600 mb-6">
                식물이 에너지를 가득 머금었습니다!
            </p>
            <button id="modal-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-jua text-lg py-3 rounded-xl shadow-md transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-400">
                다음 단계로! (Enter)
            </button>
        </div>
    </div>

    <script>
        // Game Constants & Word List (10 Stages)
        const MAX_MISTAKES = 8;
        
        const WORDS = [
            { word: "WATER", hint: "뿌리에서 흡수되어 광합성에 사용되는 액체" },
            { word: "ENERGY", hint: "식물이 광합성을 통해 저장하고 생명활동에 사용하는 것" },
            { word: "OXYGEN", hint: "광합성 결과 발생하며, 호흡에 필요한 기체" },
            { word: "GLUCOSE", hint: "광합성으로 최초로 만들어지는 양분" },
            { word: "SUGARCANE", hint: "광합성 양분을 설탕 형태로 저장하는 대표적인 식물" },
            { word: "CARBONDIOXIDE", hint: "광합성에 필요하며, 호흡 결과 방출되는 기체" },
            { word: "PHOTOSYNTHESIS", hint: "빛에너지를 이용하여 양분을 만드는 과정" },
            { word: "STARCH", hint: "광합성으로 만들어진 양분이 잎에 임시로 저장되는 형태" },
            { word: "RESPIRATION", hint: "포도당을 분해하여 생명 활동에 필요한 에너지를 얻는 과정" },
            { word: "CHLOROPLAST", hint: "식물 세포에서 광합성이 일어나는 장소" }
        ];

        // State Variables
        let currentStage = 0;
        let currentWord = "";
        let currentHint = "";
        let guessedLetters = new Set();
        let mistakes = 0;
        let isGameOver = false;

        // Tone.js Sound Synthesizer Initialization
        let synth = null;

        function initAudio() {
            if (!synth && window.Tone) {
                try {
                    Tone.start();
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -8;
                } catch (e) {
                    console.log("Audio Context Error:", e);
                }
            }
        }

        function playCorrectSound() {
            try {
                initAudio();
                if (synth) synth.triggerAttackRelease(["E5", "G5"], "8n");
            } catch(e) {}
        }

        function playWrongSound() {
            try {
                initAudio();
                if (synth) synth.triggerAttackRelease(["C3", "F#2"], "8n");
            } catch(e) {}
        }

        function playWinSound() {
            try {
                initAudio();
                if (synth) synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n");
            } catch(e) {}
        }

        function playGameOverSound() {
            try {
                initAudio();
                if (synth) synth.triggerAttackRelease(["G3", "Eb3", "C3"], "4n");
            } catch(e) {}
        }

        // DOM Elements
        const stageDisplay = document.getElementById("stage-display");
        const leavesContainer = document.getElementById("leaves-container");
        const plantIllustration = document.getElementById("plant-illustration");
        const hintText = document.getElementById("hint-text");
        const wordDisplay = document.getElementById("word-display");
        const keyboard = document.getElementById("keyboard");
        const modal = document.getElementById("modal");
        const modalIcon = document.getElementById("modal-icon");
        const modalTitle = document.getElementById("modal-title");
        const modalMessage = document.getElementById("modal-message");
        const modalBtn = document.getElementById("modal-btn");

        function getPlantSVG(mistakeCount) {
            // Colors shift from vibrant green -> yellow brown -> withered brown
            const stemColors = ["#16a34a", "#22c55e", "#65a30d", "#84cc16", "#a16207", "#854d0e", "#713f12", "#543310", "#3f2207"];
            const leafColors = ["#22c55e", "#4ade80", "#84cc16", "#a3e635", "#ca8a04", "#a16207", "#854d0e", "#713f12", "#523212"];
            const flowerColors = ["#f43f5e", "#fb7185", "#f43f5e", "#fb923c", "#d97706", "#9a3412", "#78350f", "#522504", "#3b1a03"];

            const stemColor = stemColors[mistakeCount] || stemColors[8];
            const leafColor = leafColors[mistakeCount] || leafColors[8];
            const flowerColor = flowerColors[mistakeCount] || flowerColors[8];

            // Curvature/droop increases with mistakes
            const stemCurve = mistakeCount * 6; 
            const plantDroop = mistakeCount * 5;

            // Render different stages of wilting
            return `
                <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ground/Soil -->
                    <ellipse cx="100" cy="175" rx="70" ry="12" fill="#78350f" opacity="0.8"/>
                    <ellipse cx="100" cy="173" rx="65" ry="9" fill="#92400e"/>

                    ${mistakeCount < 8 ? `
                        <!-- Main Stem -->
                        <path d="M 100 170 Q ${100 + stemCurve} ${120 + plantDroop/2} ${100 + stemCurve * 1.5} ${70 + plantDroop}" 
                              fill="none" stroke="${stemColor}" stroke-width="8" stroke-linecap="round" />

                        <!-- Left Leaf 1 -->
                        ${mistakeCount < 7 ? `
                        <path d="M ${98 + stemCurve*0.5} ${140 + plantDroop*0.5} Q ${60 + stemCurve} ${130 + plantDroop} ${55 + stemCurve} ${145 + plantDroop}" 
                              fill="${leafColor}" stroke="${stemColor}" stroke-width="2"/>
                        ` : ''}

                        <!-- Right Leaf 1 -->
                        ${mistakeCount < 6 ? `
                        <path d="M ${102 + stemCurve*0.7} ${125 + plantDroop*0.6} Q ${140 + stemCurve} ${110 + plantDroop} ${145 + stemCurve} ${125 + plantDroop}" 
                              fill="${leafColor}" stroke="${stemColor}" stroke-width="2"/>
                        ` : ''}

                        <!-- Left Leaf 2 -->
                        ${mistakeCount < 5 ? `
                        <path d="M ${99 + stemCurve} ${100 + plantDroop*0.8} Q ${65 + stemCurve} ${80 + plantDroop} ${70 + stemCurve} ${95 + plantDroop}" 
                              fill="${leafColor}" stroke="${stemColor}" stroke-width="2"/>
                        ` : ''}

                        <!-- Flower Petals & Center -->
                        ${mistakeCount < 8 ? `
                        <g transform="translate(${100 + stemCurve * 1.5}, ${70 + plantDroop})">
                            <!-- Petals -->
                            ${mistakeCount < 4 ? `<circle cx="0" cy="-14" r="8" fill="${flowerColor}" />` : ''}
                            ${mistakeCount < 5 ? `<circle cx="14" cy="0" r="8" fill="${flowerColor}" />` : ''}
                            ${mistakeCount < 3 ? `<circle cx="0" cy="14" r="8" fill="${flowerColor}" />` : ''}
                            ${mistakeCount < 6 ? `<circle cx="-14" cy="0" r="8" fill="${flowerColor}" />` : ''}
                            <!-- Flower Center -->
                            <circle cx="0" cy="0" r="9" fill="${mistakeCount > 4 ? '#78350f' : '#facc15'}" />
                        </g>
                        ` : ''}

                        <!-- Fallen Leaves on Ground -->
                        ${mistakeCount >= 4 ? `<ellipse cx="75" cy="172" rx="8" ry="3" fill="${leafColor}" transform="rotate(-10 75 172)" />` : ''}
                        ${mistakeCount >= 6 ? `<ellipse cx="125" cy="174" rx="7" ry="3" fill="${leafColor}" transform="rotate(15 125 174)" />` : ''}
                        ${mistakeCount >= 7 ? `<ellipse cx="90" cy="175" rx="6" ry="2.5" fill="${flowerColor}" />` : ''}
                    ` : `
                        <!-- Game Over: Completely Dried Dead Stem -->
                        <path d="M 100 170 Q 125 145 135 125 T 145 105" 
                              fill="none" stroke="#451a03" stroke-width="6" stroke-linecap="round" />
                        <path d="M 120 140 Q 100 130 95 128" 
                              fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
                        <!-- Dead Fallen Leaves on Soil -->
                        <ellipse cx="70" cy="173" rx="10" ry="3" fill="#522504" transform="rotate(-15 70 173)" />
                        <ellipse cx="130" cy="174" rx="9" ry="3" fill="#451a03" transform="rotate(20 130 174)" />
                        <ellipse cx="105" cy="175" rx="7" ry="2.5" fill="#381302" />
                    `}
                </svg>
            `;
        }

        function renderLives() {
            leavesContainer.innerHTML = "";
            for (let i = 0; i < MAX_MISTAKES; i++) {
                const leafSvg = document.createElement("div");
                leafSvg.className = `leaf-icon ${i >= (MAX_MISTAKES - mistakes) ? 'leaf-lost' : ''}`;
                leafSvg.innerHTML = `
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.5 2 2 6.5 2 12C2 17.5 6.5 22 12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2ZM12 20C7.6 20 4 16.4 4 12C4 7.6 7.6 4 12 4C16.4 4 20 7.6 20 12C20 16.4 16.4 20 12 20Z" fill="none"/>
                        <path d="M17 8C11 8 7 12 6 18C12 18 16 14 17 8Z" fill="#22c55e"/>
                        <path d="M12 13L7 18" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                `;
                leavesContainer.appendChild(leafSvg);
            }
        }

        function renderWord() {
            wordDisplay.innerHTML = "";
            let isComplete = true;

            for (const char of currentWord) {
                const letterBox = document.createElement("div");
                letterBox.className = "w-10 h-12 sm:w-12 sm:h-14 bg-white border-2 border-emerald-300 rounded-xl flex items-center justify-center font-jua text-xl sm:text-2xl text-emerald-900 shadow-sm";

                if (guessedLetters.has(char)) {
                    letterBox.textContent = char;
                    letterBox.classList.add("bg-emerald-50", "border-emerald-500");
                } else {
                    letterBox.textContent = "_";
                    letterBox.classList.add("text-transparent", "border-slate-300");
                    isComplete = false;
                }
                wordDisplay.appendChild(letterBox);
            }

            // Check Win condition
            if (isComplete && currentWord.length > 0 && !isGameOver) {
                handleStageClear();
            }
        }

        function renderPlant() {
            plantIllustration.innerHTML = getPlantSVG(mistakes);
        }

        function resetKeyboard() {
            const buttons = keyboard.querySelectorAll("button");
            buttons.forEach(btn => {
                btn.disabled = false;
                btn.className = "key-btn bg-white hover:bg-emerald-50 text-slate-700 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-200 shadow-sm text-sm sm:text-base";
            });
        }

        function loadStage(stageIndex) {
            currentStage = stageIndex;
            currentWord = WORDS[currentStage].word;
            currentHint = WORDS[currentStage].hint;
            guessedLetters.clear();
            mistakes = 0;
            isGameOver = false;

            stageDisplay.textContent = `${currentStage + 1} / ${WORDS.length}`;
            hintText.textContent = currentHint;

            resetKeyboard();
            renderLives();
            renderPlant();
            renderWord();
            hideModal();
        }

        function makeGuess(letter) {
            if (isGameOver || guessedLetters.has(letter)) return;

            guessedLetters.add(letter);

            // Update Keyboard Button UI
            const btn = keyboard.querySelector(`button[data-key="${letter}"]`);
            if (btn) {
                btn.disabled = true;
                if (currentWord.includes(letter)) {
                    btn.className = "key-btn bg-emerald-500 text-white font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-emerald-600 shadow-inner opacity-90 cursor-not-allowed";
                } else {
                    btn.className = "key-btn bg-slate-200 text-slate-400 font-bold py-2.5 px-2 sm:px-3 rounded-lg border border-slate-300 shadow-inner opacity-60 cursor-not-allowed";
                }
            }

            if (currentWord.includes(letter)) {
                playCorrectSound();
                renderWord();
            } else {
                mistakes++;
                playWrongSound();
                renderLives();
                renderPlant();

                if (mistakes >= MAX_MISTAKES) {
                    handleGameOver();
                }
            }
        }

        function handleStageClear() {
            isGameOver = true;
            playWinSound();

            setTimeout(() => {
                if (currentStage < WORDS.length - 1) {
                    showModal("🎉", "정답입니다!", `'${currentWord}' 단어를 맞췄습니다.<br>식물이 더 싱싱해졌어요!`, "다음 단계로! (Enter)");
                } else {
                    showModal("🏆", "축하합니다!", "식물과 에너지 단원의 모든 행맨 단어를 마스터하셨습니다!", "처음부터 다시하기 (Enter)");
                }
            }, 300);
        }

        function handleGameOver() {
            isGameOver = true;
            playGameOverSound();

            setTimeout(() => {
                showModal("🥀", "게임 오버!", `식물이 시들어 고사했습니다.<br>정답은 <strong class="text-emerald-700">${currentWord}</strong> 이었습니다.`, "다시 시도하기 (Enter)");
            }, 300);
        }

        // Modal Controls
        function showModal(icon, title, message, btnText) {
            modalIcon.textContent = icon;
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            modalBtn.textContent = btnText;
            modal.classList.remove("hidden");
            modalBtn.focus();
        }

        function hideModal() {
            modal.classList.add("hidden");
        }

        function handleModalClick() {
            if (mistakes >= MAX_MISTAKES) {
                // Restart current stage on Game Over
                loadStage(currentStage);
            } else if (currentStage < WORDS.length - 1) {
                // Move to next stage
                loadStage(currentStage + 1);
            } else {
                // Restart from stage 1 after final completion
                loadStage(0);
            }
        }

        // Virtual Keyboard Listener
        keyboard.addEventListener("click", (e) => {
            const target = e.target.closest("button");
            if (target && !target.disabled) {
                const key = target.getAttribute("data-key");
                if (key) makeGuess(key);
            }
        });

        // Physical Keyboard Listener (A-Z and Enter)
        window.addEventListener("keydown", (e) => {
            // Handle Modal Enter key
            if (!modal.classList.contains("hidden")) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    handleModalClick();
                }
                return;
            }

            // Enter key shortcut to trigger button if focused or active
            if (e.key === "Enter" && isGameOver) {
                handleModalClick();
                return;
            }

            // Key A-Z guessing
            const key = e.key.toUpperCase();
            if (/^[A-Z]$/.test(key)) {
                makeGuess(key);
            }
        });

        // Modal Button Click Listener
        modalBtn.addEventListener("click", handleModalClick);

        // Start Game on Page Load
        window.onload = () => {
            loadStage(0);
        };
    </script>
</body>
</html>
